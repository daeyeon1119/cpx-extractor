<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<title>CPX 추출기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CPX 추출기">
<style>
/* ────────────────────────────────────────────────────────────────
   디자인 결정 (UI Anti-Slop 체크리스트의 실행 규칙 7가지)
   1. 방향  시험장 호출판. 화면의 주인공은 '뽑힌 케이스 이름' 하나, 나머지는 조용히.
   2. 글꼴  한글은 플랫폼 고딕 — 오프라인 PWA라 웹폰트 없이도 모든 기기에서 보장된다.
            숫자(진행·개수)는 고정폭 tabular — 바뀌어도 자리가 흔들리지 않게.
   3. 색    종이 바탕 + 먹 글씨. 브랜드 색을 만들지 않는다. 강조는 먹 반전(검은 버튼)뿐.
   4. 간격  4px 배수 (4·8·12·16·20·24·32·48).
   5. 위계  ① 케이스 이름 ② 뽑기 버튼·진행 ③ 분야별 현황·기록.
            카드·그림자 대신 가는 선 + 라벨로 구획. radius: 구조 0 / 조작 요소 2px.
   6. 밀도  결과만 넉넉하게, 현황·기록은 표처럼 촘촘하게.
            PC는 좌(뽑기)·우(현황) 2단, 휴대폰은 1단 + 뽑기 버튼을 엄지 위치에 고정.
   7. 모션  새 케이스 등장(상태 변화)과 진행 막대만. 장식용 등장 효과 없음.
   ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#F3F2EE; --surface:#FAF9F6;
  --ink:#161615; --ink-2:#3A3936; --muted:#6C6A65; --faint:#A09D96;
  --line:#DCD9D2; --line-2:#C6C2B9; --inv-fg:#FAF9F6; --scrim:rgba(22,22,21,.42);
  --f-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#121211; --surface:#1A1A18;
  --ink:#ECEAE4; --ink-2:#CFCCC4; --muted:#9A978E; --faint:#67645E;
  --line:#2A2926; --line-2:#3C3B37; --inv-fg:#121211; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.caption{font-size:12.5px;line-height:1.55;color:var(--muted)}
.link{font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

.app{max-width:1000px;margin:0 auto;padding:0 20px calc(32px + env(safe-area-inset-bottom))}
@media(max-width:560px){.app{padding-left:16px;padding-right:16px}}

/* ── 상단: 이름과 도구만 ── */
.top{display:flex;align-items:center;gap:8px;height:56px;border-bottom:1px solid var(--line)}
.mark{margin-right:auto;font-size:15px;font-weight:800;letter-spacing:-.02em}
.tool{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:2px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tool:hover{border-color:var(--ink);color:var(--ink)}
.tool.icon{width:32px;padding:0;display:grid;place-items:center}
.tool.icon svg{width:16px;height:16px}

/* ── 조작 요소 ── */
.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 16px;
  background:var(--ink);color:var(--inv-fg);border-radius:2px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.btn-primary:hover:not(:disabled){background:var(--ink-2)}
.btn-primary:active:not(:disabled){transform:translateY(1px)}
.btn-primary:disabled{background:var(--line);color:var(--faint)}

/* ── 시작 화면: 첫 화면이 곧 기능 ── */
.start{max-width:640px;padding-top:28px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cov{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line-2);
  border-radius:2px;background:var(--surface);font-size:14px;font-weight:600;line-height:34px}
.cov b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;color:var(--muted)}
.cov:hover{border-color:var(--ink)}
.cov.off{background:transparent;border-style:dashed;color:var(--faint);text-decoration:line-through}
.cov.off b{color:var(--faint)}
.chips-note{margin-top:10px}
.cta{margin-top:28px}
.cta .caption{margin-top:8px}

.pick{margin-top:36px;border-top:1px solid var(--line)}
.disclose{display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;font-size:15px;font-weight:700;text-align:left}
.disclose .chev{font-size:12px;color:var(--muted);transition:transform .15s}
.disclose[aria-expanded="true"] .chev{transform:rotate(180deg)}
.custom-box{display:none}
.custom-box.open{display:block}
.pick-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;font-size:13px;color:var(--muted)}
.pick-head b{color:var(--ink);font-weight:700}
.pick-group{display:grid;grid-template-columns:136px minmax(0,1fr);gap:8px 16px;padding:12px 0;border-top:1px solid var(--line)}
.pick-group-head{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pick-gname{font-size:13.5px;font-weight:700}
.pick-gall{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.pick-gall:hover{color:var(--ink)}
.pick-chips{display:flex;flex-wrap:wrap;gap:6px}
.case-chip{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);font-size:13.5px}
.case-chip:hover{border-color:var(--ink)}
.case-chip.on{background:var(--ink);border-color:var(--ink);color:var(--inv-fg);font-weight:700}
.pick-foot{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
@media(max-width:560px){
  .pick-group{grid-template-columns:minmax(0,1fr)}
  .pick-group-head{flex-direction:row;align-items:baseline;justify-content:space-between}
  /* 고정 버튼 영역은 화면 가로 끝까지 — 경계가 비치지 않게 */
  .pick-foot{margin:0 -16px;padding-left:16px;padding-right:16px}
}
.local-note{margin-top:28px}

/* ── 추첨 화면 ── */
/* PC: 좌(결과·뽑기) / 우(현황).  휴대폰: 결과 → 현황 순으로 쌓고, 뽑기 버튼은 화면 아래에 계속 붙어 있게 */
.stage-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);
  grid-template-areas:"stage side" "bar side";grid-template-rows:auto 1fr;column-gap:56px;padding-top:20px}
.stage{grid-area:stage}
.side{grid-area:side}
@media(max-width:860px){
  .stage-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side" "bar";grid-template-rows:auto}
}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:2px}
.seg button{height:30px;padding:0 12px;border-radius:1px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--ink);color:var(--inv-fg)}
.mode-note{margin-top:10px;min-height:20px}

.result{display:flex;flex-direction:column;justify-content:flex-end;min-height:208px;margin-top:20px;
  padding:28px 0 24px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.result .cat-badge{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.result .word{display:block;margin-top:6px;font-size:clamp(40px,10.5vw,66px);font-weight:800;line-height:1.06;letter-spacing:-.035em;word-break:keep-all}
.result .placeholder{font-size:clamp(26px,6.4vw,34px);font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--faint)}
.result .placeholder small{display:block;margin-top:10px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}
.result .done-note{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.result.fresh .word,.result.fresh .cat-badge{animation:fresh .16s ease-out}
@keyframes fresh{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.progress{display:flex;align-items:center;gap:12px;margin-top:14px}
.track{flex:1;height:2px;background:var(--line)}
.track>span{display:block;height:100%;width:0;background:var(--ink);transition:width .2s ease-out}
.prog-num{font-size:13px;color:var(--ink-2)}

.draw-bar{grid-area:bar;align-self:start;position:sticky;bottom:0;z-index:5;margin-top:20px;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.kbd-hint{margin-top:8px;text-align:center}
@media(hover:none){.kbd-hint{display:none}}
@media(max-width:860px){
  /* 화면 가로 끝까지 채워 고정 영역의 경계가 보이지 않게, 위쪽에만 의도된 선 하나 */
  .draw-bar{margin:24px -20px 0;padding-left:20px;padding-right:20px;border-top:1px solid var(--line)}
  .result{min-height:150px;padding:20px 0 18px}
}
@media(max-width:560px){
  .draw-bar{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
}

.side{padding-top:24px}
@media(min-width:861px){.side{padding-top:62px}}
.side-sec+.side-sec{margin-top:32px}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.cat-card{display:grid;grid-template-columns:minmax(0,1fr) 72px 52px;align-items:center;gap:12px;min-height:36px;border-bottom:1px solid var(--line);font-size:13.5px}
.cat-name{font-weight:600}
.cat-bar{height:2px;background:var(--line)}
.cat-bar>span{display:block;height:100%;background:var(--ink)}
.cat-frac{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;color:var(--ink-2)}
.cat-card.done{color:var(--faint)}
.cat-card.done .cat-frac{color:var(--faint)}
.cat-card.done .cat-bar>span{background:var(--faint)}
.hist-list{list-style:none}
.hist-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-row:first-child .hist-w{font-weight:800}
.hist-n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;color:var(--faint)}
.hist-w{font-weight:600;word-break:keep-all}
.hist-c{font-size:12px;color:var(--muted);white-space:nowrap}
.hist-empty{padding:12px 0;font-size:13px;color:var(--faint)}

/* ── 설치 안내 (사용자가 [앱 설치]를 눌렀을 때만) ── */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
@media(min-width:561px){.modal{align-items:center;padding:24px}}
.modal-card{width:100%;max-width:440px;background:var(--bg);border-top:1px solid var(--ink);padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:561px){.modal-card{border:1px solid var(--ink);border-radius:2px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.modal-x{width:32px;height:32px;font-size:20px;color:var(--muted)}
.modal-x:hover{color:var(--ink)}
.modal-body ol{list-style:none;counter-reset:st;display:grid;gap:12px}
.modal-body li{counter-increment:st;display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.6}
.modal-body li::before{content:counter(st);font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:3px}
.modal-body b{font-weight:800}
.modal-note{margin-top:14px}
.modal-card .btn-primary{margin-top:20px;height:48px;font-size:15px}

@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="mark">CPX 추출기</span>
    <button class="tool" id="installBtn" hidden>앱 설치</button>
    <button class="tool icon" id="themeBtn" aria-label="어두운 화면으로 전환">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="view-draw">
    <!-- 시작: 첫 화면이 곧 기능 -->
    <section class="start" id="inputPanel">
      <div class="row-head">
        <span class="label">분야</span>
        <button type="button" class="link" id="covAllBtn" hidden>모두 포함</button>
      </div>
      <div class="chips" id="covGrid"></div>
      <p class="caption chips-note">누른 분야는 이번 라운드에서 빠집니다.</p>

      <div class="cta">
        <button class="btn-primary" id="presetBtn"><span id="presetLabel">56개 케이스로 시작</span></button>
        <p class="caption">뽑은 케이스는 이번 라운드에서 다시 나오지 않습니다.</p>
      </div>

      <div class="pick">
        <button type="button" class="disclose" id="casePickToggle" aria-expanded="false" aria-controls="casePickBox">
          케이스 직접 고르기 <span class="chev" aria-hidden="true">▾</span>
        </button>
        <div class="custom-box" id="casePickBox">
          <div class="pick-head">
            <span id="pickCount">고른 케이스 <b class="num">0</b>개</span>
            <button type="button" class="link" id="pickClearBtn" hidden>모두 해제</button>
          </div>
          <div id="casePickList"></div>
          <div class="pick-foot">
            <button class="btn-primary" id="pickStartBtn" disabled>케이스를 고르세요</button>
          </div>
        </div>
      </div>

      <p class="caption local-note">기록과 선택은 이 기기의 브라우저에만 저장됩니다.</p>
    </section>

    <!-- 추첨 -->
    <section id="drawPanel" hidden>
      <div class="stage-grid">
        <div class="stage">
          <div class="stage-top">
            <div class="seg" id="modeSelect" role="group" aria-label="뽑기 방식">
              <button type="button" class="active" data-mode="mix" aria-pressed="true">고르게 섞기</button>
              <button type="button" data-mode="once" aria-pressed="false">분야당 1개</button>
              <button type="button" data-mode="random" aria-pressed="false">완전 랜덤</button>
            </div>
            <button type="button" class="link" id="resetBtn">처음으로</button>
          </div>
          <p class="caption mode-note" id="probText"></p>

          <div class="result" id="result" aria-live="polite"></div>

          <div class="progress">
            <div class="track"><span id="progFill"></span></div>
            <span class="prog-num num"><span id="progDone">0</span> / <span id="progTotal">0</span></span>
          </div>
        </div>

        <aside class="side">
          <section class="side-sec" id="catCard" hidden>
            <div class="sec-label"><span class="label">분야별</span></div>
            <div id="catOverview"></div>
          </section>
          <section class="side-sec" id="histCard" hidden>
            <div class="sec-label"><span class="label">뽑은 순서</span><span class="caption num" id="histCount"></span></div>
            <ol class="hist-list" id="historyList"></ol>
          </section>
        </aside>

        <div class="draw-bar">
          <button class="btn-primary" id="drawBtn">첫 케이스 뽑기</button>
          <p class="caption kbd-hint">스페이스바로도 뽑을 수 있습니다</p>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 설치 방법 안내 -->
<div class="modal" id="installHelp" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="installHelpTitle">
    <div class="modal-head">
      <span class="modal-title" id="installHelpTitle">홈 화면에 설치하기</span>
      <button type="button" class="modal-x" data-close aria-label="닫기">×</button>
    </div>
    <div class="modal-body" id="installHelpBody"></div>
    <p class="caption modal-note" id="installHelpNote"></p>
    <button type="button" class="btn-primary" data-close>확인</button>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  /* ===== 케이스 목록 (사용자가 정한 명칭 그대로) ===== */
  const CASES = {
    '소화기': ['급성 복통','소화불량/만성복통','토혈','혈변','구토','변비','설사','황달'],
    '순환기': ['가슴통증','실신','두근거림','고혈압','이상지질혈증'],
    '호흡기': ['기침','콧물/코막힘','객혈','호흡곤란'],
    '신장/비뇨': ['다뇨증','핍뇨','붉은색 소변','배뇨이상','소변찔금증'],
    '전신': ['발열','쉽게 멍이 듦','피로','체중 감소','체중 증가/비만'],
    '관절/근골격/피부': ['관절 통증/부기','목통증','허리통증','피부발진'],
    '정신': ['기분 변화','불안','수면장애'],
    '신경': ['기억력 저하','어지럼','두통','경련','근력/감각이상','의식장애','떨림/운동이상'],
    '산부/여성/소아': ['유방통/유방덩이','질분비물','질출혈','월경이상','월경통','산전진찰','성장/발달지연','예방접종'],
    '상담': ['음주상담','금연상담','물질 오남용','나쁜 소식 전하기','가정폭력','성폭력','자살']
  };
  // 전체 케이스 수 — 목록에서 자동 계산 (표기가 어긋나지 않도록)
  const TOTAL_CASES = Object.keys(CASES).reduce((s,c)=>s+CASES[c].length, 0);

  // 케이스 이름 변경 이력 — 예전에 저장된 진행 상태·선택을 현재 이름으로 옮긴다
  const RENAMED = {
    '배뇨통': '배뇨이상',
    '요실금': '소변찔금증',
    '유방통': '유방통/유방덩이',
    '유방덩이': '유방통/유방덩이'
  };
  // 두 케이스가 하나로 합쳐진 이름 (예전 저장분에 둘 다 있으면 하나만 남긴다)
  const MERGED = new Set(['유방통/유방덩이']);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ===== 테마 ===== */
  const THEME_KEY = 'cpxTheme';
  const THEME_BG = { light:'#F3F2EE', dark:'#121211' };
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', THEME_BG[t]);
    $('themeBtn').setAttribute('aria-label', t === 'dark' ? '밝은 화면으로 전환' : '어두운 화면으로 전환');
  }
  let theme = null;
  try{ theme = localStorage.getItem(THEME_KEY); }catch(e){}   // 저장소가 막혀도 앱은 떠야 한다
  if(theme !== 'dark' && theme !== 'light'){
    theme = (window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
  $('themeBtn').addEventListener('click', ()=>{
    theme = theme === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    applyTheme(theme);
  });

  /* ===== 분야 선택 — 누르면 이번 라운드에서 제외 ===== */
  const CATSEL_KEY = 'cpxCatSel';
  let catSel = {};   // {분야: false} 만 기록 (기본은 포함)
  try{ const v = JSON.parse(localStorage.getItem(CATSEL_KEY)); if(v && typeof v === 'object') catSel = v; }catch(e){}
  function selectedCats(){ return Object.keys(CASES).filter(c => catSel[c] !== false); }
  function persistCatSel(){ try{ localStorage.setItem(CATSEL_KEY, JSON.stringify(catSel)); }catch(e){} }
  function renderCovGrid(){
    $('covGrid').innerHTML = Object.keys(CASES).map(c => {
      const off = catSel[c] === false;
      return '<button type="button" class="cov'+(off?' off':'')+'" data-cat="'+escapeHtml(c)+'" aria-pressed="'+(!off)+'">'
        + escapeHtml(c)+'<b>'+CASES[c].length+'</b></button>';
    }).join('');
    const sel = selectedCats();
    const total = sel.reduce((s,c)=>s+CASES[c].length, 0);
    const allOn = (sel.length === Object.keys(CASES).length);
    $('presetLabel').textContent = allOn
      ? TOTAL_CASES + '개 케이스로 시작'
      : (sel.length === 0 ? '분야를 하나 이상 고르세요'
                          : sel.length + '개 분야 · ' + total + '개 케이스로 시작');
    $('presetBtn').disabled = (sel.length === 0);
    $('covAllBtn').hidden = allOn;
  }
  $('covGrid').addEventListener('click', e=>{
    const b = e.target.closest('.cov'); if(!b) return;
    const c = b.dataset.cat;
    catSel[c] = (catSel[c] === false);   // 꺼져 있으면 켜고, 켜져 있으면 끈다
    persistCatSel(); renderCovGrid();
  });
  $('covAllBtn').addEventListener('click', ()=>{ catSel = {}; persistCatSel(); renderCovGrid(); });
  renderCovGrid();

  /* ===== 케이스 직접 고르기 ===== */
  $('casePickToggle').addEventListener('click', ()=>{
    const open = !$('casePickBox').classList.contains('open');
    $('casePickBox').classList.toggle('open', open);
    $('casePickToggle').setAttribute('aria-expanded', String(open));
  });

  const CASESEL_KEY = 'cpxCaseSel';
  let caseSel = {};   // {"분야||케이스": true}
  try{ const v = JSON.parse(localStorage.getItem(CASESEL_KEY)); if(v && typeof v === 'object') caseSel = v; }catch(e){}
  const caseKey = (cat, w) => cat + '||' + w;
  function persistCaseSel(){ try{ localStorage.setItem(CASESEL_KEY, JSON.stringify(caseSel)); }catch(e){} }
  (function migrateCaseSel(){
    let changed = false;
    Object.keys(caseSel).forEach(k => {
      const i = k.indexOf('||'); if(i < 0) return;
      const cat = k.slice(0, i), w = k.slice(i + 2);
      if(RENAMED[w]){ delete caseSel[k]; caseSel[caseKey(cat, RENAMED[w])] = true; changed = true; }
    });
    if(changed) persistCaseSel();
  })();
  function selectedCases(){
    const arr = [];
    Object.keys(CASES).forEach(cat => CASES[cat].forEach(w => {
      if(caseSel[caseKey(cat, w)]) arr.push({w:w, c:cat});
    }));
    return arr;
  }
  function renderCasePick(){
    $('casePickList').innerHTML = Object.keys(CASES).map(cat => {
      const allOn = CASES[cat].every(w => caseSel[caseKey(cat, w)]);
      return '<div class="pick-group">'
        + '<div class="pick-group-head">'
        +   '<span class="pick-gname">'+escapeHtml(cat)+'</span>'
        +   '<button type="button" class="pick-gall" data-cat="'+escapeHtml(cat)+'">'+(allOn ? '전체 해제' : '전체 선택')+'</button>'
        + '</div>'
        + '<div class="pick-chips">'
        +   CASES[cat].map(w => {
              const on = !!caseSel[caseKey(cat, w)];
              return '<button type="button" class="case-chip'+(on ? ' on' : '')+'" aria-pressed="'+on+'"'
                + ' data-cat="'+escapeHtml(cat)+'" data-w="'+escapeHtml(w)+'">'+escapeHtml(w)+'</button>';
            }).join('')
        + '</div></div>';
    }).join('');
    const n = selectedCases().length;
    $('pickCount').innerHTML = '고른 케이스 <b class="num">'+n+'</b>개';
    $('pickClearBtn').hidden = (n === 0);
    $('pickStartBtn').disabled = (n === 0);
    $('pickStartBtn').textContent = n === 0 ? '케이스를 고르세요' : '고른 ' + n + '개로 시작';
  }
  $('casePickList').addEventListener('click', e=>{
    const chip = e.target.closest('.case-chip');
    if(chip){
      const k = caseKey(chip.dataset.cat, chip.dataset.w);
      if(caseSel[k]) delete caseSel[k]; else caseSel[k] = true;
      persistCaseSel(); renderCasePick();
      return;
    }
    const gall = e.target.closest('.pick-gall');
    if(gall){
      const cat = gall.dataset.cat;
      const allOn = CASES[cat].every(w => caseSel[caseKey(cat, w)]);
      CASES[cat].forEach(w => {
        if(allOn) delete caseSel[caseKey(cat, w)];
        else caseSel[caseKey(cat, w)] = true;
      });
      persistCaseSel(); renderCasePick();
    }
  });
  $('pickClearBtn').addEventListener('click', ()=>{ caseSel = {}; persistCaseSel(); renderCasePick(); });
  $('pickStartBtn').addEventListener('click', ()=>{
    const items = selectedCases();
    if(items.length === 0){ alert('케이스를 한 개 이상 골라 주세요.'); return; }
    startRound(items);
  });
  renderCasePick();

  /* ===================== 추첨 로직 ===================== */
  const KEY = 'wordDrawerState';
  let pool = [];        // 남은 케이스 [{w,c}] — 고르게 섞기 모드에서는 '예정표' 순서
  let drawn = [];       // 뽑힌 케이스 [{w,c}]
  let lastCat = null;
  const MODES = ['mix', 'once', 'random'];
  let mode = 'mix';
  let planned = false;  // pool이 이미 고르게 섞기 예정표 순서인가
  let catTotals = {};   // 이번 라운드에 포함된 분야 (키 = 분야 목록)

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        active: !$('drawPanel').hidden,
        pool, drawn, lastCat, mode, planned, catTotals,
        last: drawn.length ? drawn[drawn.length-1].w : null
      }));
    }catch(e){}
  }
  function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }

  function normItem(x){
    const it = (typeof x==='string') ? {w:x, c:null} : x;
    if(RENAMED[it.w]) it.w = RENAMED[it.w];
    return it;
  }
  // 합쳐진 케이스가 예전 저장분에 두 번 남아 있으면 하나만 둔다
  function dedupeMerged(){
    const seen = new Set();
    const keep = it => {
      if(!MERGED.has(it.w)) return true;
      const k = it.c + '||' + it.w;
      if(seen.has(k)) return false;
      seen.add(k); return true;
    };
    drawn = drawn.filter(keep);   // 이미 뽑은 쪽을 먼저 남겨, 남은 쪽의 중복이 빠지게 한다
    pool = pool.filter(keep);
  }

  function shuffle(a){
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ── 고르게 섞기: 라운드 전체의 '예정표'를 한 번에 짠다 ──
  // 분야에 케이스가 n개면, 그 분야의 k번째 케이스를 라운드의 (k + 난수) / n 지점에 놓는다.
  // → 큰 분야는 자주, 작은 분야는 드물게 나오고, 어느 분야도 앞이나 뒤에 몰리지 않는다
  //   (검증: 모든 케이스의 평균 순서 = 라운드 한가운데, 앞쪽 절반에 나올 확률 50%).
  //   대신 같은 분야끼리는 일정 간격을 두는 경향이 있다 — 완전 랜덤보다 덜 뭉치게 하는 게 목적.
  // 마지막으로 같은 분야가 연달아 오면, 바로 뒤의 다른 분야 케이스를 앞으로 당겨 끼운다.
  function planMix(items, prevCat){
    const byCat = {};
    items.forEach(it => { (byCat[it.c] = byCat[it.c] || []).push(it); });
    const slots = [];
    Object.keys(byCat).forEach(c => {
      const list = shuffle(byCat[c].slice());
      const n = list.length;
      list.forEach((it, k) => slots.push({ it: it, pos: (k + Math.random()) / n }));
    });
    slots.sort((a, b) => a.pos - b.pos);
    const seq = slots.map(s => s.it);
    for(let i = 0; i < seq.length; i++){
      const prev = i === 0 ? prevCat : seq[i-1].c;
      if(prev == null || seq[i].c !== prev) continue;
      let j = i + 1;
      while(j < seq.length && seq[j].c === prev) j++;
      if(j >= seq.length) break;            // 남은 게 모두 같은 분야면 연속은 피할 수 없다
      seq.splice(i, 0, seq.splice(j, 1)[0]);
    }
    return seq;
  }

  function restore(){
    let s;
    try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){ s = null; }
    if(!s || !s.active || !Array.isArray(s.pool)) return;
    pool = s.pool.map(normItem);
    drawn = Array.isArray(s.drawn) ? s.drawn.map(normItem) : [];
    lastCat = s.lastCat || null;
    const savedMode = (s.mode === 'rotate') ? 'mix' : s.mode;   // 예전 '분야 순환'은 '고르게 섞기'로 이어간다
    mode = MODES.indexOf(savedMode) >= 0 ? savedMode : 'mix';
    planned = (mode === 'mix' && s.mode === 'mix' && s.planned === true);
    catTotals = s.catTotals && Object.keys(s.catTotals).length ? s.catTotals : {};
    if(Object.keys(catTotals).length === 0){
      pool.concat(drawn).forEach(it=>{ if(it.c) catTotals[it.c] = (catTotals[it.c]||0)+1; });
    }
    dedupeMerged();
    const last = s.last ? (RENAMED[s.last] || s.last) : null;
    setMode(mode, true);
    showStage(true);
    if(pool.length === 0){
      const lastItem = drawn.length ? drawn[drawn.length-1] : null;
      if(lastItem){
        $('result').innerHTML =
          (lastItem.c ? '<span class="cat-badge">'+escapeHtml(lastItem.c)+'</span>' : '')
          + '<span class="word">'+escapeHtml(lastItem.w)+'</span>'
          + '<span class="done-note">'+drawn.length+'개 모두 뽑았습니다</span>';
      } else {
        $('result').innerHTML = '<span class="placeholder">모두 뽑았습니다</span>';
      }
    } else if(last){
      $('result').innerHTML = '<span class="placeholder">이어서 뽑으세요<small>직전 · '+escapeHtml(last)+'</small></span>';
    } else {
      $('result').innerHTML = '<span class="placeholder">첫 케이스를 뽑으세요</span>';
    }
    render();
  }

  function loadPreset(){
    const sel = selectedCats();
    if(sel.length === 0){ alert('분야를 하나 이상 골라 주세요.'); return; }
    const arr = [];
    sel.forEach(cat => CASES[cat].forEach(w => arr.push({w:w, c:cat})));
    startRound(arr);
  }

  function startRound(items){
    pool = items.slice();
    drawn = []; lastCat = null; planned = false;
    catTotals = {};
    items.forEach(it=>{ if(it.c) catTotals[it.c] = (catTotals[it.c]||0)+1; });
    showStage(true);
    $('result').innerHTML = '<span class="placeholder">첫 케이스를 뽑으세요</span>';
    render();
    save();
    window.scrollTo(0, 0);
  }

  function showStage(on){
    $('inputPanel').hidden = on;
    $('drawPanel').hidden = !on;
    const hasCats = Object.keys(catTotals).length > 0;
    $('catCard').hidden = !on || !hasCats;
    $('histCard').hidden = !on;
  }

  function uniqueCats(){
    const set = [];
    pool.forEach(it=>{ if(it.c && set.indexOf(it.c)===-1) set.push(it.c); });
    return set;
  }

  function pickIndex(){
    const cats = uniqueCats();
    if(mode === 'random' || cats.length === 0){
      return { idx: Math.floor(Math.random()*pool.length), bulkCat: null };
    }
    if(mode === 'mix'){
      if(!planned){ pool = planMix(pool, lastCat); planned = true; }
      return { idx: 0, bulkCat: null };
    }
    // once: 분야 하나를 고르고, 그 분야의 나머지는 이번 라운드에서 뺀다
    const cat = cats[Math.floor(Math.random()*cats.length)];
    const idxs = pool.map((it,i)=> it.c===cat ? i : -1).filter(i=>i>=0);
    return { idx: idxs[Math.floor(Math.random()*idxs.length)], bulkCat: cat };
  }

  function draw(){
    if(pool.length === 0) return;
    const { idx, bulkCat } = pickIndex();
    const item = pool[idx];
    pool.splice(idx,1);
    if(bulkCat){ pool = pool.filter(it => it.c !== bulkCat); }
    drawn.push({w:item.w, c:item.c});
    lastCat = item.c;
    const finished = pool.length === 0;
    const r = $('result');
    r.innerHTML =
      (item.c ? '<span class="cat-badge">'+escapeHtml(item.c)+'</span>' : '')
      + '<span class="word">'+escapeHtml(item.w)+'</span>'
      + (finished ? '<span class="done-note">마지막 케이스 · '+drawn.length+'개 모두 뽑았습니다</span>' : '');
    r.classList.remove('fresh'); void r.offsetWidth; r.classList.add('fresh');   // 새 케이스가 나왔다는 신호
    render();
    save();
  }

  function render(){
    const n = pool.length;
    let note;
    if(n === 0) note = '모두 뽑았습니다. [처음으로]에서 새 라운드를 시작할 수 있습니다.';
    else if(mode === 'mix') note = '분야 크기 비율대로 고르게 섞고, 같은 분야가 연달아 나오지 않게 합니다.';
    else if(mode === 'once') note = '분야마다 한 개씩만 뽑습니다. 남은 분야 ' + uniqueCats().length + '개.';
    else note = '남은 ' + n + '개 중에서 무작위로 뽑습니다.';
    $('probText').textContent = note;
    const btn = $('drawBtn');
    btn.disabled = (n === 0);
    btn.textContent = n === 0 ? '모두 뽑았습니다' : (drawn.length ? '다음 케이스' : '첫 케이스 뽑기');
    document.querySelector('.kbd-hint').hidden = (n === 0);
    renderProgress();
    renderCats();
    renderHistory();
  }

  function renderProgress(){
    let total, done, unit = '';
    if(mode === 'once' && Object.keys(catTotals).length){
      total = Object.keys(catTotals).length;      // 전체 분야 수
      done = total - uniqueCats().length;          // 뽑은 분야 수
      unit = ' 분야';
    } else {
      total = drawn.length + pool.length;          // 끝까지 뽑았을 때의 총 추출 수
      done = drawn.length;
    }
    $('progDone').textContent = done;
    $('progTotal').textContent = total + unit;
    $('progFill').style.width = total ? (done/total*100)+'%' : '0%';
  }

  function renderCats(){
    const cats = Object.keys(catTotals);
    if(cats.length === 0){ return; }
    const remByCat = {}, drawnByCat = {};
    pool.forEach(it=>{ if(it.c) remByCat[it.c] = (remByCat[it.c]||0)+1; });
    drawn.forEach(it=>{ if(it.c) drawnByCat[it.c] = (drawnByCat[it.c]||0)+1; });
    const onceMode = (mode === 'once');
    $('catOverview').innerHTML = cats.map(c=>{
      const rem = remByCat[c] || 0;
      const done = drawnByCat[c] || 0;
      const total = done + rem;
      const consumed = (rem === 0);
      const fracTxt = onceMode ? (consumed ? '뽑음' : '대기') : (done + '/' + total);
      const pct = onceMode ? (consumed ? 100 : 0) : (total ? (done/total*100) : 0);
      return '<div class="cat-card'+(consumed?' done':'')+'">'
        + '<span class="cat-name">'+escapeHtml(c)+'</span>'
        + '<div class="cat-bar"><span style="width:'+pct+'%"></span></div>'
        + '<span class="cat-frac">'+fracTxt+'</span></div>';
    }).join('');
  }

  function renderHistory(){
    $('histCount').textContent = drawn.length ? String(drawn.length) : '';
    const box = $('historyList');
    if(drawn.length === 0){
      box.innerHTML = '<li class="hist-empty">아직 뽑은 케이스가 없습니다.</li>';
      return;
    }
    box.innerHTML = drawn.slice().reverse().map((it,i)=>{
      const num = drawn.length - i;
      return '<li class="hist-row"><span class="hist-n">'+num+'</span>'
        + '<span class="hist-w">'+escapeHtml(it.w)+'</span>'
        + (it.c ? '<span class="hist-c">'+escapeHtml(it.c)+'</span>' : '<span></span>')+'</li>';
    }).join('');
  }

  function setMode(m, silent){
    if(MODES.indexOf(m) < 0) m = 'mix';
    const changed = (m !== mode);
    mode = m;
    document.querySelectorAll('#modeSelect button').forEach(b=>{
      const on = b.dataset.mode === m;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
    });
    if(!changed) return;   // 켜져 있는 방식을 다시 눌러도 진행 중인 예정표는 그대로
    planned = false;       // 방식이 바뀌면, 고르게 섞기로 돌아올 때 남은 케이스로 예정표를 새로 짠다
    if(!silent){ render(); save(); }
  }

  function reset(){
    pool = []; drawn = []; lastCat = null; planned = false;
    catTotals = {};
    clearSaved();
    showStage(false);
  }

  $('presetBtn').addEventListener('click', loadPreset);
  $('drawBtn').addEventListener('click', draw);
  $('resetBtn').addEventListener('click', ()=>{
    if(drawn.length && pool.length && !confirm('진행 중인 라운드를 끝내고 처음으로 돌아갈까요?')) return;
    reset();
  });
  document.querySelectorAll('#modeSelect button').forEach(b=>
    b.addEventListener('click', ()=> setMode(b.dataset.mode)));

  // 스페이스바로 뽑기 — 한 번 누를 때 한 개만 (꾹 누를 때의 키 반복은 무시)
  document.addEventListener('keydown', e=>{
    if(e.code !== 'Space') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'button') return;
    if($('drawPanel').hidden) return;
    const help = document.getElementById('installHelp');
    if(help && !help.hidden) return;   // 설치 안내가 떠 있으면 뒤에서 뽑지 않는다
    e.preventDefault();
    if(e.repeat) return;
    draw();
  });

  /* ===================== 초기화 ===================== */
  restore();
})();
</script>

<script>
/* ===== PWA: 서비스 워커 + 설치 (네이티브 프롬프트 or 브라우저별 안내) ===== */
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  var deferred = null;
  var btn = document.getElementById('installBtn');
  var overlay = document.getElementById('installHelp');
  var helpBody = document.getElementById('installHelpBody');
  var helpNote = document.getElementById('installHelpNote');

  function isStandalone(){
    return (window.matchMedia && (
             window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: window-controls-overlay)').matches))
        || window.navigator.standalone === true;
  }

  function env(){
    var ua = navigator.userAgent || '';
    return {
      ios: /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
      android: /Android/.test(ua),
      inApp: /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|everytimeApp|; wv\)/i.test(ua),
      firefox: /Firefox|FxiOS/.test(ua),
      samsung: /SamsungBrowser/.test(ua)
    };
  }

  function fillHelp(){
    var e = env(), steps, note = '';
    if(e.inApp){
      steps = [
        '지금은 <b>카카오톡·인스타그램 등 앱 안의 브라우저</b>입니다. 여기서는 설치되지 않습니다.',
        '오른쪽 위 <b>⋮ 또는 공유 아이콘</b>을 누르세요.',
        '<b>다른 브라우저로 열기</b>(Chrome·Safari)를 고른 뒤, 그 화면에서 다시 설치하세요.'
      ];
    } else if(e.ios){
      steps = [
        '아이폰·아이패드는 <b>Safari</b>에서만 설치됩니다.',
        '화면 아래 가운데의 <b>공유 버튼</b>(□에 ↑)을 누르세요.',
        '목록에서 <b>홈 화면에 추가</b> → 오른쪽 위 <b>추가</b>.'
      ];
      note = '설치하면 주소창 없이 전체 화면으로 열립니다.';
    } else if(e.samsung){
      steps = [
        '삼성 인터넷 아래쪽의 <b>≡ 메뉴</b>를 누르세요.',
        '<b>현재 페이지 추가 → 홈 화면</b>을 고르세요.',
        '홈 화면에 생긴 아이콘으로 실행하면 됩니다.'
      ];
    } else if(e.android){
      steps = [
        '크롬 오른쪽 위 <b>⋮ 메뉴</b>를 누르세요.',
        '<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 고르세요.',
        '<b>설치</b>를 누르면 끝납니다.'
      ];
    } else if(e.firefox){
      steps = [
        '지금 브라우저(Firefox 등)는 <b>앱 설치를 지원하지 않습니다.</b>',
        '<b>Chrome</b> 또는 <b>Edge</b>로 이 페이지를 다시 여세요.',
        '그 브라우저에서 [앱 설치]를 누르면 됩니다.'
      ];
    } else {
      steps = [
        '주소창 <b>오른쪽 끝의 설치 아이콘</b>(⊕ 또는 모니터 모양)을 누르세요.',
        '보이지 않으면 <b>⋮ 메뉴 → 앱 설치 / CPX 추출기 설치</b>를 고르세요.',
        '창이 뜨면 <b>설치</b>를 누르면 끝납니다.'
      ];
      note = '설치 아이콘이 없다면 이미 설치됐거나, 새로고침하면 나타납니다.';
    }
    helpBody.innerHTML = '<ol>' + steps.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ol>';
    helpNote.textContent = note;
    helpNote.style.display = note ? '' : 'none';
  }

  function openHelp(){ if(overlay){ fillHelp(); overlay.hidden = false; } }
  function closeHelp(){ if(overlay) overlay.hidden = true; }

  function refreshBtn(){ if(btn) btn.hidden = isStandalone(); }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    refreshBtn();
  });

  if(btn){
    btn.addEventListener('click', function(){
      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(res){
          if(res && res.outcome === 'accepted') btn.hidden = true;
          deferred = null;
        });
      } else {
        openHelp();
      }
    });
  }

  window.addEventListener('appinstalled', function(){
    deferred = null;
    if(btn) btn.hidden = true;
    closeHelp();
  });

  if(overlay){
    overlay.addEventListener('click', function(e){
      if(e.target === overlay || e.target.hasAttribute('data-close')) closeHelp();
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && !overlay.hidden) closeHelp();
    });
  }

  refreshBtn();
})();
</script>
</body>
</html>
